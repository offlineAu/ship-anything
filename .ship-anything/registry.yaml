      compatibility: [ claude, codex, opencode, cursor, gemini ]
      maintenance: active
      pin: null
      enabled: false
      security:
        status: needs-review
        notes: >-
          Core search script is stdlib Python with no network. Sub-skills 'design' call third-party image APIs with env keys; 'ui-styling' runs the shadcn CLI. Do not copy its demo .claude/settings.json (enables all project MCP servers and broad home-directory reads). Sub-skill provenance unverified.
