      install: "npx skills add anthropics/skills --skill frontend-design"
      compatibility: [ claude, codex, opencode, cursor, gemini ]
      maintenance: active
      pin: null
      enabled: false
      security: { status: needs-review, notes: "Markdown only, no scripts (per research). Pin to a commit after 2c5958e (2026-11-06) when per-skill Apache-2.0 licensing applies." }
    anthropic-webapp-testing:
      source: anthropics/skills
      path: skills/webapp-testing
      license: Apache-2.0
      classification: OPTIONAL
      category: quality
