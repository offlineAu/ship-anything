# SHIP ANYTHING skill registry.
# - skills.internal is GENERATED from skills/*/SKILL.md and workflows/*.md by
#   `node scripts/generate/registry.mjs` — do not hand-edit that section.
# - skills.external is curated by hand. Evidence: docs/research/skill-candidates.md (verified 2026-11-25).
#   External skills are untrusted until reviewed: .ship-anything/policies/external-skills.md.
#   enabled: true requires security.status approved|approved-instructions-only AND a pin.
