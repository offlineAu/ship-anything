      compatibility: [ claude, codex, opencode, cursor, gemini ]
      maintenance: active
      pin: null
      enabled: false
      security: { status: needs-review, notes: "Bundles Python helper scripts for Playwright; review before enabling." }
    anthropic-skill-creator:
      source: anthropics/skills
      path: skills/skill-creator
      license: Apache-2.0
      classification: ADOPT
      category: efficiency
      agents: [ documentation-agent ]
      role: maintainer tooling for authoring and evaluating skills (contributors, not end users)
      install: "npx skills add anthropics/skills --skill skill-creator"
      compatibility: [ claude ]
      maintenance: active
      pin: null
      enabled: false
      security: { status: needs-review, notes: "Contains eval scripts; maintainer use only." }
    impeccable:
      source: pbakaus/impeccable
      license: Apache-2.0
      classification: ADOPT
      category: design
      agents: [ ux-agent, frontend-agent, qa-agent ]
      role: design critique / audit / polish reviewer (supporting skill)
      install: "npx impeccable install"
      compatibility: [ claude, codex, opencode, cursor, gemini ]
      maintenance: active
      pin: null
      enabled: false
      security:
        status: needs-review
        notes: >-
          Installer offers SessionStart/PostToolUse/Stop hooks that run outside model approval — keep OFF unless the user opts in. Live mode can launch codex/claude with approvals and sandbox bypassed; set IMPECCABLE_LIVE_COPY_AGENT=off. Downloads a native binary (sha256-checked). Fetches design directions from impeccable.style; DO_NOT_TRACK=1 disables telemetry only.
    emil-kowalski-skills:
      source: emilkowalski/skills
      license: MIT
      classification: ADOPT
      category: design
      agents: [ motion-agent, ux-agent, frontend-agent ]
      role: motion and interaction authority; recommended subset only
      subset: [ emil-design-eng, animate, review-animations, improve-animations, animation-performance, mobile-native, break-ui, learn-taste ]
      install: "npx skills add emilkowalski/skills"
      compatibility: [ claude, codex, opencode, cursor, gemini ]
      maintenance: active
      pin: null
      enabled: false
      security: { status: needs-review, notes: "Markdown only, no scripts or hooks (per research)." }
    ui-ux-pro-max:
      source: nextlevelbuilder/ui-ux-pro-max-skill
      license: MIT
      classification: OPTIONAL
      category: design
      agents: [ ux-agent ]
