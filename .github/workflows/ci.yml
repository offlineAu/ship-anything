name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: validate + test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/generate/registry.mjs --check
      - run: npm run validate
      - run: npm test
      - name: Smoke-test init in a scratch project
        shell: bash
        run: |
          dir="$(mktemp -d)"
          node packages/cli/bin/ship-anything.js init --agent all --yes --cwd "$dir"
          node packages/cli/bin/ship-anything.js validate --cwd "$dir"
          node packages/cli/bin/ship-anything.js init --agent all --yes --cwd "$dir" | grep "Already up to date"
