name: Adapter compatibility report
description: Report results of using SHIP ANYTHING with a specific coding agent version
labels: [adapter]
body:
  - type: dropdown
    id: agent
    attributes: { label: Coding agent, options: [Claude Code, Codex, OpenCode, Cursor, Gemini CLI, Other] }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Agent version }
    validations: { required: true }
  - type: textarea
    id: results
    attributes: { label: "What loaded / what didn't (agents, skills, instructions)", description: Include exact commands and output }
    validations: { required: true }
